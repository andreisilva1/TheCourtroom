name: the-courtroom

services:
  frontend:
    build:
      context: ./frontend
      args:
        # Baked into the static build so the browser knows which host port
        # the API is published on. Keep in sync with API_PORT below.
        VITE_API_PORT: "${API_PORT:-8001}"
    ports:
      - "${FRONTEND_PORT:-5176}:5176"
    depends_on:
      - api

  api:
    build: .
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8001
    ports:
      - "${API_PORT:-8001}:8001"
    depends_on:
      - redis
      - qdrant
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - .:/app
    working_dir: /app
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - QDRANT_HOST=qdrant
      - OLLAMA_HOST=${OLLAMA_HOST:-http://host.docker.internal:11434}

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "${QDRANT_PORT:-6333}:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"

  celery:
    build: .
    command: celery -A backend.worker.celery worker --loglevel=info
    depends_on:
      - redis
      - qdrant
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - .:/app
    working_dir: /app
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - QDRANT_HOST=qdrant
      - OLLAMA_HOST=${OLLAMA_HOST:-http://host.docker.internal:11434}

volumes:
  qdrant_data:
