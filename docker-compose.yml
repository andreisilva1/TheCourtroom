services:
  frontend:
    build: ./frontend
    ports:
      - "5176:5176"
    depends_on:
      - api
    environment:
      - VITE_API_URL=http://localhost:8001

  api:
    build: .
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8001
    ports:
      - "8001:8001"
    depends_on:
      - redis
      - qdrant
      - ollama
    volumes:
      - .:/app
    working_dir: /app
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - QDRANT_HOST=qdrant
      - OLLAMA_HOST=http://ollama:11434

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  ollama:
    build:
      context: .
      dockerfile: backend/Dockerfile.ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  celery:
    build: .
    command: celery -A backend.worker.celery worker --loglevel=info
    depends_on:
      - redis
      - qdrant
      - ollama
    volumes:
      - .:/app
    working_dir: /app
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - QDRANT_HOST=qdrant
      - OLLAMA_HOST=http://ollama:11434

volumes:
  qdrant_data:
  ollama_data:
